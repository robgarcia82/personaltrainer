<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guia Treino">
<meta name="theme-color" content="#C6FF00">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geist:wght@100..900&display=swap">
<title>Personal Trainer — Roberto Garcia</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%;min-height:100dvh;background:#050505 !important;color:#F5F5F5;font-family:'Geist',system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body,p,span,div,a,label,button,input,textarea,select{font-family:'Geist',system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Arial,sans-serif}
h1,h2,h3,h4,h5,h6,.bn{font-family:'Bebas Neue','Geist',system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.08em}
/* Título grande/display — Bebas Neue 60px (clamp opcional via inline) */
.display-title{font-family:'Bebas Neue','Geist',system-ui,sans-serif;font-size:60px;font-weight:400;line-height:.9;letter-spacing:.02em;text-transform:uppercase}
h1{letter-spacing:.12em}
/* Home (v125): faixa da semana + cards de dado. O card de hoje é uma linha
   compacta — o hero de 420px saiu, e com ele o .hero-foot do v124. */
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;width:132px}
/* Abaixo de 380px a grade do mês cede a largura pro número da esquerda */
@media (max-width:380px){.month-grid{width:118px;gap:5px}}
/* Card do carrossel: em telas de 320px a coluna de texto ficava com 90px e
   truncava "Superiores 1 · 6 exercícios". Foto, botão e respiro encolhem
   pra devolver ~30px pro texto. */
.treino-card{gap:12px;padding:12px}
.treino-card__foto{width:72px;height:72px}
.treino-card__play{width:48px;height:48px}
.treino-card__meta{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:360px){
  .treino-card{gap:10px;padding:10px}
  .treino-card__foto{width:56px;height:56px}
  .treino-card__play{width:44px;height:44px}
  /* Aqui nem encolhendo tudo cabe "Superiores 2 · 6 exercícios" numa linha:
     deixa quebrar em duas em vez de cortar a contagem de exercícios. */
  .treino-card__meta{font-size:11px;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.25}
}
::-webkit-scrollbar{display:none}
input::placeholder{color:#333}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
/* sem filter:blur — causa flicker branco no Safari iOS durante a transição */
@keyframes screenDissolve{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.screen-enter{animation:screenDissolve 220ms ease-out both}
.selectable{transition:background-color 220ms ease,color 220ms ease,box-shadow 220ms ease,transform 180ms ease,opacity 220ms ease,filter 220ms ease,border-color 220ms ease}
.selectable:active{transform:scale(0.98)}
@keyframes selectedDissolve{from{opacity:.72;filter:blur(2px);transform:scale(.985)}to{opacity:1;filter:blur(0);transform:scale(1)}}
.selected-dissolve{animation:selectedDissolve 220ms ease-out both}
/* sem filter:blur — idem screenDissolve. scale reduzido pra .99 (mais sutil) */
@keyframes flowDissolveIn{from{opacity:0;transform:scale(.99) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes flowDissolveOut{from{opacity:1;transform:scale(1) translateY(0)}to{opacity:0;transform:scale(.99) translateY(8px)}}
.flow-screen{animation:flowDissolveIn 220ms ease-out both;will-change:opacity,transform}
.flow-screen-exit{animation:flowDissolveOut 200ms ease-in both;will-change:opacity,transform}
.flow-fade{transition:opacity 220ms ease,transform 220ms ease}
/* Shell persistente do fluxo de série — fica montado enquanto QUALQUER etapa
   (countdown/run/carga/PSE/descanso) estiver ativa. Background sólido evita
   flicker entre transições de etapas. NÃO anima — só o conteúdo interno. */
.flow-shell{position:fixed;inset:0;z-index:650;background:#050505;overflow:hidden}
@keyframes flowStepIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
.flow-step{animation:flowStepIn 200ms ease-out both;background:#050505;min-height:100dvh;will-change:opacity,transform}
/* Defesa contra flicker branco: força background dark + GPU layer cedo */
.screen-enter,.flow-screen,.flow-screen-exit,.flow-step{background-color:#050505;backface-visibility:hidden;-webkit-backface-visibility:hidden;-webkit-transform:translateZ(0);transform:translateZ(0)}
@media (prefers-reduced-motion:reduce){.screen-enter,.selectable,.selected-dissolve,.flow-screen,.flow-screen-exit,.flow-fade,.flow-step{transition:none !important;animation:none !important}}
body.in-exercise .app-navbar,body.in-active-set .app-navbar{display:none !important}
button:focus-visible{outline:2px solid #C6FF00;outline-offset:2px}
input:focus-visible{outline:2px solid #C6FF00;outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<script>
const h=React.createElement,{useState,useEffect,useRef,useMemo}=React;
const APP_VERSION="v126";
let _entrySeq=0;// contador p/ IDs de série únicos mesmo em taps rápidos
console.log("Guia Treino",APP_VERSION);

// ── EXERCÍCIOS ────────────────────────────────────────────────────
// Superiores 1 (Seg) — Peito + Tríceps
// Superiores 2 (Ter) — Costas + Bíceps
// Superiores 3 (Qui) — Ombros
// Inferiores  (Sáb) — Pernas + Core
// Bônus       (Progressão) — Pull-ups
const EX=[
// ── SUPERIORES 1 — PEITO + TRÍCEPS ──────────────────────────────
{id:1,n:"Supino com Halteres",m:"Peitoral maior",s:"Superiores 1",d:"Seg",f:"Peito",eq:"halter",imgPos:"center top",video:"assets/videos/supino-halteres.mp4",
st:["Deite no banco com um halter em cada mão, pés firmes no chão.","Braços estendidos acima do peito, halteres alinhados com os ombros.","Desça controlando por 2-3s até os cotovelos na altura do peito.","Empurre para cima de forma explosiva.","Mantenha as escápulas retraídas durante todo o movimento."],
t:"Imagine que está empurrando o corpo para dentro do banco. Isso ativa mais o peitoral.",
e:"Não arquear excessivamente as costas. Manter cotovelos em ~75°.",
b1:"3x10-12 | PSE 6-7",b2:"4x8-10 | PSE 7-8",b3:"4x6-8 | PSE 8-9",dl:"2x10-12 | PSE 5-6"},

{id:2,n:"Supino Inclinado c/ Halteres",m:"Peitoral superior",s:"Superiores 1",d:"Seg",f:"Peito",eq:"halter",
st:["Ajuste o banco para 30-45 graus.","Deite com os halteres na altura dos ombros.","Empurre para cima seguindo linha inclinada.","Desça controlando até sentir o alongamento.","Escápulas retraídas no banco."],
t:"30° ativa mais peitoral. 45° envolve mais deltóide. Prefira 30°.",
e:"Não subir o banco acima de 45°.",
b1:"3x10-12 | PSE 6-7",b2:"3x8-10 | PSE 7-8",b3:"3x8-10 | PSE 8",dl:"2x10-12 | PSE 5-6",video:"assets/videos/supino-inclinado-halteres.mp4"},

{id:3,n:"Voador na Polia",m:"Peitoral — contração constante",s:"Superiores 1",d:"Seg",f:"Peito",eq:"mc1000",
st:["Polia na altura do peito ou levemente acima. Fique de lado para a MC-1000.","Segure o cabo com a mão mais afastada da máquina — cotovelo levemente flexionado e fixo.","Traga o cabo em arco na frente do peito até cruzar levemente a linha central.","Pause 1s na contração máxima — aperte o peitoral.","Retorne controlando em 2-3 segundos. Complete a série e troque o lado."],
t:"A polia mantém tensão máxima exatamente onde o halter perde — na contração. É o único isolamento de peito que carrega o músculo no ponto mais curto. Use peso leve com execução perfeita.",
e:"Não deixar o cotovelo dobrar mais durante o movimento — ele fica fixo. Não usar impulso do tronco. Não subir o braço acima da altura do ombro.",
b1:"3x12-15 | PSE 6-7",b2:"3x10-12 | PSE 7-8",b3:"3x10-12 | PSE 8",dl:"2x12-15 | PSE 5-6"},

{id:4,n:"Dips nas Paralelas",m:"Peitoral inferior + Tríceps",s:"Superiores 1",d:"Seg",f:"Braços",eq:"mc1000",
st:["Segure as barras paralelas da MC-1000, braços estendidos, corpo suspenso.","Incline o tronco para frente (~30°) para ativar mais peitoral inferior.","Flexione os cotovelos descendo até 90°.","Empurre explosivamente até estender.","Controle todo o movimento — não deixe cair."],
t:"Inclinação para frente = mais peito. Tronco reto = mais tríceps. Neste treino, incline para frente. Para progredir: halter entre os pés.",
e:"Não descer abaixo de 90° (estresse excessivo no ombro). Não abrir os cotovelos.",
b1:"3x8-12 | PSE 6-7",b2:"3x8-10 | PSE 7-8",b3:"3x6-8 | PSE 8-9",dl:"2x10-12 | PSE 5-6"},

{id:5,n:"Tríceps Pushdown na Polia",m:"Tríceps — 3 cabeças",s:"Superiores 1",d:"Seg",f:"Braços",eq:"mc1000",
st:["Polia no ponto mais alto da MC-1000.","Segure barra reta ou corda com pegada pronada.","Cotovelos colados ao corpo — não se movem.","Empurre para baixo estendendo completamente.","Retorne controlando até antebraços paralelos ao chão."],
t:"Com corda: gire as mãos para fora no ponto final para maximizar contração. Cotovelos fixos são a chave.",
e:"Cotovelos não saem da posição. Não inclinar o tronco para frente.",
b1:"3x12-15 | PSE 6-7",b2:"3x10-12 | PSE 7-8",b3:"3x8-10 | PSE 8",dl:"2x12-15 | PSE 5-6"},

{id:6,n:"Tríceps Francês c/ Halteres",m:"Tríceps — cabeça longa",s:"Superiores 1",d:"Seg",f:"Braços",eq:"halter",
st:["Deite no banco, halteres acima do peito com braços estendidos — palmas uma para a outra.","Cotovelos fixos apontando para o teto durante todo o movimento.","Dobre os cotovelos abaixando os halteres em direção às orelhas.","Desça até sentir alongamento profundo no tríceps.","Estenda completamente — sem travar os cotovelos."],
t:"A cabeça longa do tríceps (a maior, ~60% do músculo) só é trabalhada quando o braço está elevado. Essencial para braços grandes. Use menos peso que no pushdown.",
e:"Não abrir os cotovelos para os lados — isso tira a tensão do tríceps. Não usar impulso do tronco.",
b1:"3x12-15 | PSE 6-7",b2:"3x10-12 | PSE 7-8",b3:"3x8-10 | PSE 8",dl:"2x12-15 | PSE 5-6"},

// ── SUPERIORES 2 — COSTAS + BÍCEPS ──────────────────────────────
{id:7,n:"Lat Pulldown na Polia",m:"Dorsais, redondo maior, bíceps",s:"Superiores 2",d:"Ter",f:"Costas",eq:"mc1000",
st:["Sente sob a polia alta da MC-1000. Use o pad de apoio de joelhos.","Segure a barra com pegada pronada, mais larga que os ombros.","Puxe a barra em direção ao peito — cotovelos para baixo e para trás.","Aperte as costas no ponto mais baixo por 1s.","Retorne controlando até estender completamente os braços."],
t:"Pense em puxar com os cotovelos, não com as mãos. Incline levemente o tronco para trás no puxão.",
e:"Não puxar atrás da cabeça — lesão de ombro. Não balançar o tronco.",
b1:"3x10-12 | PSE 6-7",b2:"4x8-10 | PSE 7-8",b3:"4x6-8 | PSE 8-9",dl:"2x10-12 | PSE 5-6"},

{id:8,n:"Cable Row — Remada Polia Baixa",m:"Dorsais, romboides, trapézio",s:"Superiores 2",d:"Ter",f:"Costas",eq:"mc1000",
st:["Polia no ponto mais baixo. Sente com os pés no suporte da MC-1000.","Segure o puxador, braços completamente estendidos — sinta o alongamento.","Puxe em direção ao abdômen, cotovelos para trás.","Aperte as escápulas juntas por 1s.","Retorne controlando — permita leve inclinação do tronco à frente."],
t:"Tensão constante é superior à remada com halter para hipertrofia. Tronco permanece reto durante o puxão — não balance.",
e:"Não inclinar excessivamente para trás. Não arredondar a lombar no retorno.",
b1:"3x10-12 | PSE 6-7",b2:"3-4x8-10 | PSE 7-8",b3:"4x6-8 | PSE 8-9",dl:"2x10-12 | PSE 5-6"},

{id:9,n:"Remada c/ Halter (Unilateral)",m:"Dorsais, romboides, trapézio",s:"Superiores 2",d:"Ter",f:"Costas",eq:"halter",
st:["Apoie joelho e mão ipsilaterais no banco. Perna oposta firme no chão.","Segure o halter com braço completamente estendido — sinta o alongamento.","Puxe em direção ao quadril — cotovelo rente ao corpo.","Aperte as costas no topo por 1s.","Desça controlando até extensão total."],
t:"Pense em puxar com o cotovelo, não com a mão. Permite amplitude maior que a remada bilateral.",
e:"Não girar o tronco para subir o peso — isso usa o lombar, não as costas.",
b1:"3x10-12 | PSE 6-7",b2:"3-4x8-10 | PSE 7-8",b3:"4x6-8 | PSE 8-9",dl:"2x10-12 | PSE 5-6"},

{id:10,n:"Straight Arm Pulldown",m:"Dorsais — isolamento sem bíceps",s:"Superiores 2",d:"Ter",f:"Costas",eq:"mc1000",
st:["Polia no ponto mais alto. Use a corda ou barra reta.","Fique em pé a ~60cm da máquina, inclinado levemente para frente — core contraído.","Segure o acessório com os braços quase totalmente estendidos — cotovelos levemente flexionados e fixos.","Puxe em arco para baixo até as mãos chegarem às coxas — sem dobrar os cotovelos.","Aperte as costas 1s no ponto mais baixo. Retorne controlando — braços voltam acima da cabeça."],
t:"Único exercício de costas que elimina o bíceps completamente — trabalha APENAS os dorsais. O alongamento no topo (braços acima da cabeça) é um dos melhores estímulos para hipertrofia de dorsais.",
e:"Não dobrar os cotovelos durante o movimento — se estiver dobrando, o peso está alto demais. Não inclinar o tronco para dar impulso.",
b1:"3x12-15 | PSE 6-7",b2:"3x10-12 | PSE 7-8",b3:"3x10-12 | PSE 8",dl:"2x12-15 | PSE 5-6"},

{id:11,n:"Rosca Inclinada c/ Halter",m:"Bíceps braquial — cabeça longa",s:"Superiores 2",d:"Ter",f:"Braços",eq:"halter",
st:["Ajuste o banco a ~60°. Sente-se e deixe os braços caírem livremente ao lado do corpo — ombro em extensão completa.","Supine as palmas (viradas para cima). Essa é a posição inicial — sinta o alongamento na cabeça longa.","Flexione ambos os braços simultaneamente até os halteres chegarem aos ombros.","Aperte o bíceps por 1s no topo.","Desça lentamente até a extensão total — o alongamento profundo no fundo é onde está o ganho."],
t:"O segredo é o ombro atrás do tronco: isso alonga completamente a cabeça longa do bíceps, que é a porção mais responsiva ao treino em amplitude longa. Deixe o braço cair livre — não force o ombro para frente.",
e:"Não elevar os cotovelos durante a subida. Não encurtar a descida — a extensão total é obrigatória.",
b1:"3x12-15 | PSE 6-7",b2:"3x10-12 | PSE 7-8",b3:"3x8-10 | PSE 8",dl:"2x12-15 | PSE 5-6"},

{id:12,n:"Rosca Scott c/ Halter",m:"Bíceps braquial — cabeça curta",s:"Superiores 2",d:"Ter",f:"Braços",eq:"halter",
st:["Apoie o braço sobre a almofada inclinada do banco Scott — braço totalmente em contato do início ao fim.","Segure o halter com pegada supinada (palma para cima).","Flexione até o halter chegar próximo ao ombro.","Aperte o bíceps por 1s no topo.","Desça controlando até quase a extensão total — não trave o cotovelo no fundo."],
t:"O apoio trava o ombro à frente, isolando o bíceps por completo. Isso enfatiza a cabeça curta e sobrecarrega o fundo do movimento no alongamento — complemento perfeito da Rosca Inclinada: uma cobre a cabeça longa, a outra a curta.",
e:"Não usar impulso — o apoio existe para eliminar isso. Não forçar até o bloqueio na descida (hiperextensão do cotovelo).",
b1:"3x12-15 | PSE 6-7",b2:"3x10-12 | PSE 7-8",b3:"3x8-10 | PSE 8",dl:"2x12-15 | PSE 5-6"},

// ── SUPERIORES 3 — OMBROS ────────────────────────────────────────
{id:13,n:"Desenvolvimento c/ Halteres",m:"Deltóide anterior e lateral",s:"Superiores 3",d:"Qui",f:"Ombro",eq:"halter",
st:["Sentado a 90° no banco, halteres na altura dos ombros.","Cotovelos levemente à frente — não completamente para os lados.","Empurre para cima até quase estender (sem travar).","Desça controlando até a altura das orelhas.","Core contraído durante todo o movimento."],
t:"Sentado elimina o impulso das pernas. Não trave os cotovelos no topo — mantém tensão constante.",
e:"Não inclinar para trás — sobrecarrega lombar. Não descer abaixo das orelhas.",
b1:"3x10-12 | PSE 6-7",b2:"3-4x8-10 | PSE 7-8",b3:"4x6-8 | PSE 8-9",dl:"2x10-12 | PSE 5-6"},

{id:14,n:"Arnold Press",m:"Deltóide completo — 3 cabeças",s:"Superiores 3",d:"Qui",f:"Ombro",eq:"halter",
st:["Sentado, halteres à frente do rosto — palmas voltadas para você.","Ao empurrar para cima, gire as palmas para frente progressivamente.","Estenda os braços completamente com palmas para fora.","Na descida, faça a rotação inversa voltando às palmas para você.","Movimento contínuo e fluido — não pare nas extremidades."],
t:"A rotação recruta as 3 cabeças do deltóide em sequência — muito mais completo que o desenvolvimento tradicional. Use 10-20% menos peso.",
e:"Não apressar a rotação. Controle máximo na descida.",
b1:"3x10-12 | PSE 6-7",b2:"3x8-10 | PSE 7-8",b3:"3x8-10 | PSE 8",dl:"2x10-12 | PSE 5-6"},

{id:15,n:"Elevação Lateral na Polia",m:"Deltóide lateral — isolamento",s:"Superiores 3",d:"Qui",f:"Ombro",eq:"mc1000",
st:["Polia no ponto mais baixo. Fique de lado para a MC-1000.","Segure o cabo com a mão mais afastada da máquina — passe o cabo na frente do corpo se necessário.","Levante o braço em arco lateral até a altura dos ombros — cotovelo levemente flexionado e fixo.","Pause 1s no topo.","Desça controlando devagar — sinta a tensão constante em todo o arco. Complete todas as reps antes de trocar o lado."],
t:"Tensão constante do cabo é superior ao halter — o halter perde tensão no ponto baixo (onde o músculo está em maior desvantagem mecânica), o cabo mantém. Mindinho mais alto que o polegar no topo.",
e:"Não usar impulso. Não subir acima dos ombros — após isso o trapézio assume o movimento.",
b1:"3x12-15 | PSE 6-7",b2:"4x10-12 | PSE 7-8",b3:"4x10-12 | PSE 8",dl:"2x12-15 | PSE 5-6"},

{id:16,n:"Face Pull na Polia",m:"Deltóide posterior, manguito rotador",s:"Superiores 3",d:"Qui",f:"Ombro",eq:"mc1000",
st:["Polia na altura do rosto ou levemente acima.","Segure a corda com pegada neutra (polegar para cima).","Puxe em direção ao rosto abrindo os cotovelos para os lados.","No ponto final, gire as mãos para fora — 'pose de bíceps duplo'.","Retorne controlando — não deixe a carga puxar bruscamente."],
t:"ESSENCIAL para a saúde do ombro. Equilibra todo o volume de empurrar do treino. Priorize qualidade sobre carga — sempre.",
e:"Não usar peso pesado — o objetivo é ativação muscular, não força. A corda vai para o ROSTO, não para o peito.",
b1:"3x15-20 | PSE 6-7",b2:"3x12-15 | PSE 7-8",b3:"3x12-15 | PSE 8",dl:"2x15-20 | PSE 5-6"},

{id:17,n:"Elevação Frontal na Polia",m:"Deltóide anterior — tensão constante",s:"Superiores 3",d:"Qui",f:"Ombro",eq:"mc1000",
st:["Polia no ponto mais baixo. Fique de frente para a MC-1000.","Segure o cabo com uma mão — palma voltada para baixo. Pé contrário ligeiramente à frente para equilíbrio.","Levante o braço à frente em arco até a altura dos ombros — cotovelo levemente flexionado e fixo.","Pause 1s no topo com tensão no cabo.","Desça controlando em 2-3 segundos. Complete a série e troque o lado."],
t:"A polia mantém tensão constante durante todo o arco, especialmente no início (ponto fraco do halter). Use peso menor que no halter — o estímulo é maior.",
e:"Não usar impulso do tronco. Não subir o braço acima dos ombros. Manter o cotovelo fixo durante todo o movimento.",
b1:"3x12-15 | PSE 6-7",b2:"3x10-12 | PSE 7-8",b3:"3x10-12 | PSE 8",dl:"2x12-15 | PSE 5-6"},

{id:18,n:"Crucifixo Invertido na Polia",m:"Deltóide posterior — tensão constante",s:"Superiores 3",d:"Qui",f:"Ombro",eq:"mc1000",
st:["Polia na altura mais alta. Fique de lado ou de frente para a MC-1000.","Segure o cabo com a mão contrária ao lado da polia (cabo cruzado na frente do corpo).","Incline levemente o tronco à frente — core firme, joelhos levemente flexionados.","Puxe o cabo em arco para o lado e para trás até o braço ficar paralelo ao chão — cotovelo levemente flexionado e fixo.","Pause 1s no topo. Desça controlando em 2-3 segundos. Complete a série e troque o lado."],
t:"A polia alta cria tensão constante no deltóide posterior durante todo o arco — superior ao halter inclinado. Peso leve com execução perfeita é mais eficaz.",

// ── Tracking pertence ao MOVIMENTO, não ao programa ──────────────
// carga/PSE/reps/histórico são gravados e lidos sob o baseId (id do movimento
// de origem). Exercícios do Split e seus clones Full Body compartilham o mesmo
// histórico. Os 4 movimentos novos do Full Body (sem baseId) usam o próprio id.
function trackId(ex){return ex&&ex.baseId!=null?ex.baseId:(ex?ex.id:null);}
// Mapa cloneId -> baseId de TODOS os programas derivados (Full Body, Grupos).
// Usado para migrar séries antigas gravadas sob o id de um clone.
const CLONE_TO_BASE={};
function registerClones(list){list.forEach(x=>{if(x.baseId!=null)CLONE_TO_BASE[x.id]=x.baseId;});}
registerClones(FULLBODY_EX);
// Reescreve entradas do log gravadas sob o id de um clone para o id do movimento
// base. Idempotente: só toca entradas cujo exerciseId é de um clone.
function normalizeCloneIds(log){
  if(!Array.isArray(log))return{log:log,changed:false};
  let changed=false;
  const out=log.map(e=>{
    if(e&&CLONE_TO_BASE[e.exerciseId]!=null){
      changed=true;return Object.assign({},e,{exerciseId:CLONE_TO_BASE[e.exerciseId]});
    }
    return e;
  });
  return{log:out,changed:changed};
}

// Marca d'água de deleção: em vez de bloquear TUDO até o próximo treino e
// depois liberar TUDO (que é como o histórico apagado ressuscitava quando o
// delete na nuvem falhava), guarda o instante da deleção e descarta pra
// sempre qualquer série anterior a ele — venha do localStorage, do IDB ou
// da nuvem. Séries novas (ts > marca) fluem normalmente.
function getDeletionWatermark(){
  try{
    const at=Number(localStorage.getItem(WORKOUT_LOG_DELETED_AT_KEY)||0);
    if(at>0)return at;
    // Flag legada (v97–v105) não tinha timestamp: migra pra agora.
    if(localStorage.getItem("workout_log_deleted")==="true"){
      const agora=Date.now();
      try{localStorage.setItem(WORKOUT_LOG_DELETED_AT_KEY,String(agora));}catch(e){}
      return agora;
    }
    return 0;
  }catch(e){return 0;}
}
function dropApagados(log){
  const wm=getDeletionWatermark();
  if(!wm)return Array.isArray(log)?log:[];
  return (Array.isArray(log)?log:[]).filter(e=>e&&Number(e.ts)>wm);
}

// Deriva os resumos de sessão (workout_sessions) a partir do log de séries.
// O log já é persistido em localStorage + IndexedDB e sincronizado com a nuvem
// (Supabase). Como os resumos são 100% deriváveis do log, reconstruí-los aqui
// mantém a métrica mensal e o histórico consistentes E faz os treinos concluídos
// — inclusive os novos Full Body — sobreviverem e reaparecerem em qualquer
// dispositivo, sem exigir tabela extra no Supabase (respeita anon key + RLS).
function rebuildSessionsFromLog(log){
  const byKey={};
  (Array.isArray(log)?log:[]).forEach(e=>{
    if(!e||!e.session||!e.date)return;
    const key=e.date+"|"+e.session;
    let g=byKey[key];
    if(!g){g=byKey[key]={date:e.date,session:e.session,tsList:[],byEx:{}};}
    g.tsList.push(Number(e.ts)||0);
    let ex=g.byEx[e.exerciseId];
    if(!ex){ex=g.byEx[e.exerciseId]={id:e.exerciseId,name:e.exerciseName,sets:[]};}
    ex.sets.push({carga:e.carga,reps:e.reps||0,pse:e.pse,duration:e.duration,block:e.block||""});
  });
  return Object.keys(byKey).map(k=>{
    const g=byKey[k];
    const minTs=Math.min.apply(null,g.tsList),maxTs=Math.max.apply(null,g.tsList);
    const durationMin=g.tsList.length>1?Math.round((maxTs-minTs)/60000):0;
    const sc=(typeof SC!=="undefined"&&SC[g.session])?SC[g.session]:null;
    return{id:String(minTs),ts:maxTs,date:g.date,session:g.session,sessionColor:sc?sc.t:"#C6FF00",exercises:Object.keys(g.byEx).map(id=>g.byEx[id]),totalSets:g.tsList.length,durationMin};
  }).sort((a,b)=>a.ts-b.ts);
}

function openIDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error("no indexedDB"));return;}const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE,{keyPath:"id",autoIncrement:true});};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function saveBackupIDB(log){
  openIDB().then(db=>{
    const tx=db.transaction(DB_STORE,"readwrite");
    const store=tx.objectStore(DB_STORE);
    store.add({timestamp:Date.now(),version:(typeof APP_VERSION!=="undefined"?APP_VERSION:""),workout_log:log});
    store.getAll().onsuccess=function(){
      const all=this.result||[];
      if(all.length>MAX_BACKUPS){
        all.sort((a,b)=>a.timestamp-b.timestamp);
        all.slice(0,all.length-MAX_BACKUPS).forEach(b=>store.delete(b.id));
      }
    };
  }).catch(()=>{});
}
function getLastBackupIDB(){return new Promise(resolve=>{openIDB().then(db=>{const tx=db.transaction(DB_STORE,"readonly");const store=tx.objectStore(DB_STORE);store.getAll().onsuccess=function(){const all=this.result||[];if(!all.length){resolve(null);return;}all.sort((a,b)=>b.timestamp-a.timestamp);resolve(all[0]);};}).catch(()=>resolve(null));});}
function clearIDBBackups(){return new Promise(resolve=>{openIDB().then(db=>{const tx=db.transaction(DB_STORE,"readwrite");const store=tx.objectStore(DB_STORE);const req=store.clear();req.onsuccess=()=>resolve(true);req.onerror=()=>resolve(false);}).catch(()=>resolve(false));});}

  try{localStorage.removeItem(STORAGE_KEY);}catch(e){console.error("clearWorkoutHistory STORAGE_KEY",e);localRemoveOk=false;}
  // workout_sessions é derivado do log — limpa junto pra não deixar a métrica mensal órfã
  try{localStorage.removeItem("workout_sessions");}catch(e){}
  // 3. Defesa: limpa qualquer chave de backup legada/desconhecida que possa

  LEGACY_BACKUP_KEYS.forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});

  try{await clearIDBBackups();console.log("[GuiaTreino] IndexedDB backups limpos");}catch(e){console.warn("clearIDBBackups",e);}
  // 5. Apaga dados do usuário no Supabase (best-effort). Se a policy "anon

function importWorkoutData(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const data=JSON.parse(reader.result);
        if(!data||!Array.isArray(data.workout_log))return reject(new Error("Arquivo inválido (sem workout_log)"));
        const current=getWorkoutLog();
        const seen=new Set(current.map(e=>e&&e.id).filter(Boolean));
        let added=0;
        data.workout_log.forEach(e=>{if(e&&e.id&&!seen.has(e.id)){current.push(e);seen.add(e.id);added++;}});
        current.sort((a,b)=>(a.ts||0)-(b.ts||0));
        setWorkoutLog(current);
        resolve({added,total:current.length});
      }catch(err){reject(err);}
    };
    reader.onerror=()=>reject(reader.error);
    reader.readAsText(file);
  });
}

const CLOUD_TIMEOUT_MS=12000;
function cloudFetch(url,opts){
  const ctrl=typeof AbortController!=="undefined"?new AbortController():null;
  const t=ctrl?setTimeout(()=>ctrl.abort(),CLOUD_TIMEOUT_MS):null;
  const o=Object.assign({},opts||{});
  if(ctrl)o.signal=ctrl.signal;
  return fetch(url,o).finally(()=>{if(t)clearTimeout(t);});
}

// full=true refaz o push completo (boot e "Sincronizar agora"), que é a rede
// de segurança caso a lista local de ids sincronizados se perca.
async function syncWorkoutLogToCloud(full){
  if(!isSupabaseConfigured())return{ok:false,reason:"not_configured"};
  const userId=getUserId();
  const log=getWorkoutLog();
  if(log.length===0)return{ok:true,pushed:0};
  const jaSincronizados=full?new Set():getSyncedIds();
  const pendentes=log.filter(e=>e&&e.id&&!jaSincronizados.has(String(e.id)));
  if(pendentes.length===0)return{ok:true,pushed:0,skipped:log.length};
  const rows=pendentes.map(e=>entryToRow(e,userId));
  try{
    const res=await cloudFetch(SUPABASE_URL+"/rest/v1/workout_logs",{
      method:"POST",
      headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY,
        "Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify(rows)
    });
    if(!res.ok)return{ok:false,reason:"http_"+res.status,body:await res.text().catch(()=>"")};
    addSyncedIds(rows.map(r=>r.id));// só marca depois do 200: falha reenvia
    return{ok:true,pushed:rows.length};
  }catch(e){return{ok:false,reason:"network",error:e.message};}
}
// Paginado: antes era um único limit=10000 com order=ts.asc, então passando
// de 10k séries (~2,7 anos no ritmo de 4x/semana) o corte descartava
// justamente as MAIS RECENTES, sem avisar.
const CLOUD_PAGE=2000,CLOUD_MAX_PAGES=25;
async function fetchWorkoutLogFromCloud(){
  if(!isSupabaseConfigured())return{ok:false,reason:"not_configured",entries:[]};
  const userId=getUserId();
  const base=SUPABASE_URL+"/rest/v1/workout_logs?user_id=eq."+encodeURIComponent(userId)+"&order=ts.asc";
  const entries=[];
  try{
    for(let page=0;page<CLOUD_MAX_PAGES;page++){
      const res=await cloudFetch(base+"&limit="+CLOUD_PAGE+"&offset="+(page*CLOUD_PAGE),{
        headers:{"apikey":SUPABASE_ANON_KEY,"Authorization":"Bearer "+SUPABASE_ANON_KEY}
      });
      if(!res.ok)return{ok:false,reason:"http_"+res.status,entries:[]};
      const rows=await res.json();
      rows.forEach(r=>entries.push(rowToEntry(r)));
      if(rows.length<CLOUD_PAGE)return{ok:true,entries:entries};
    }
    // Chegou no teto de páginas: melhor avisar do que fingir que veio tudo.
    console.warn("[GuiaTreino] fetch parou em "+entries.length+" séries (teto de páginas)");
    return{ok:true,entries:entries,truncated:true};
  }catch(e){return{ok:false,reason:"network",error:e.message,entries:[]};}
}

function mergeWorkoutLogs(local,remote){
  const seen=new Set();const merged=[];
  local=dropApagados(local);remote=dropApagados(remote);// nada anterior à deleção volta
  (local||[]).forEach(e=>{if(e&&e.id&&!seen.has(e.id)){seen.add(e.id);merged.push(e);}});
  (remote||[]).forEach(e=>{if(e&&e.id&&!seen.has(e.id)){seen.add(e.id);merged.push(e);}});
  merged.sort((a,b)=>(a.ts||0)-(b.ts||0));
  return normalizeCloneIds(merged).log;// normaliza ids de clone vindos da nuvem/IDB
}
async function syncBidirectional(){
  if(!isSupabaseConfigured())return{ok:false,reason:"not_configured"};
  // Defesa #2: se flag setada, NÃO restaura da nuvem nem escreve em local.
  // Botão "Sincronizar agora" no Coach é o único trigger desta função.
  const remote=await fetchWorkoutLogFromCloud();
  if(!remote.ok)return remote;
  const local=getWorkoutLog();
  const merged=mergeWorkoutLogs(local,remote.entries);
  if(merged.length!==local.length){
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(merged));_syncSessionsCache(merged);saveBackupIDB(merged);}catch(e){}
  }
  const push=await syncWorkoutLogToCloud(true);// completo: é o botão de reconciliar
  return{ok:true,fetched:remote.entries.length,merged:merged.length,pushed:push.pushed||0};
}
// Debounce do push após salvar série; primeira chamada após boot
// é imediata pra garantir replicação rápida em caso de fechamento.
let _syncTimer=null;
let _syncedOnceThisSession=false;
window._lastSyncResult=null;
function _scheduleSync(){
  if(!isSupabaseConfigured())return;
  clearTimeout(_syncTimer);
  const delay=_syncedOnceThisSession?1200:0;
  _syncTimer=setTimeout(()=>{
    syncWorkoutLogToCloud().then(r=>{
      window._lastSyncResult=r;
      if(!r.ok)console.warn("Push Supabase:",r);
      else{console.log("Push Supabase OK ("+r.pushed+")");_syncedOnceThisSession=true;}
    });
  },delay);
}

// Falha de rede é rotina num app de academia e o push se recupera sozinho no
// próximo salvamento — não merece alarme vermelho em cima da tela. Já erro de

function avisaFalhaNuvem(r,acao){

  if(motivo==="network"||motivo==="not_configured"){

// Auto-restore + sync no boot
(async function autoRestoreAndSync(){
  const FLAG="__guia_restored_session";
  const uid=getUserId();
  try{
    // 0. Guard: se o usuário apagou o histórico manualmente, NÃO restaurar
    //    nem de IDB local nem de Supabase. A flag só é limpa quando uma
    //    nova série é salva (ver setWorkoutLog) ou via Resetar app.
    // 0.5 Migração: séries antigas do Full Body podem ter sido gravadas sob o id
    //     do clone (27-50). Normaliza para o id do movimento base uma única vez.
    try{
      const _norm=normalizeCloneIds(getWorkoutLog());
      if(_norm.changed){setWorkoutLog(_norm.log);console.log("Guia Treino: migrou ids de clone Full Body → base");}
    }catch(_e){console.error("normalizeCloneIds boot",_e);}
    let cur=getWorkoutLog();
    let changed=false;
    // 1. IDB local
    if(cur.length===0){
      const backup=await getLastBackupIDB();
      if(backup&&Array.isArray(backup.workout_log)&&backup.workout_log.length>0){
        const restored=normalizeCloneIds(backup.workout_log).log;
        localStorage.setItem(STORAGE_KEY,JSON.stringify(restored));
        _syncSessionsCache(restored);
        console.log("Guia Treino: IDB restaurou "+restored.length+" séries");
        changed=true;cur=restored;
      }
    }
    // 2. Supabase
    if(isSupabaseConfigured()){
      const remote=await fetchWorkoutLogFromCloud();
      if(remote.ok){
        const merged=mergeWorkoutLogs(cur,remote.entries);
        if(merged.length>cur.length){
          localStorage.setItem(STORAGE_KEY,JSON.stringify(merged));
          _syncSessionsCache(merged);
          saveBackupIDB(merged);
          const newCount=merged.length-cur.length;
          console.log("Guia Treino: Supabase trouxe "+newCount+" séries (total "+merged.length+")");
          try{sessionStorage.setItem("__guia_restore_msg","☁ Nuvem: "+newCount+" séries restauradas ("+uid+")");}catch(e){}
          changed=true;cur=merged;
        }else if(cur.length===0&&remote.entries.length===0){
          // Primeiro uso: nuvem vazia é o estado normal, não um erro.
          console.log("[GuiaTreino] nuvem vazia para user_id \""+uid+"\" (primeiro uso?)");
        }
        syncWorkoutLogToCloud(true).then(r=>{// boot: refaz o push completo
          window._lastSyncResult=r;
          if(r.ok)console.log("Push OK ("+r.pushed+")");
          else{console.warn("Push:",r);avisaFalhaNuvem(r,"enviar");}
        });
      }else{
        console.warn("Fetch Supabase:",remote);
        avisaFalhaNuvem(remote,"buscar");
      }
    }
    // 3. Reload se restaurou
    if(changed&&!sessionStorage.getItem(FLAG)){
      sessionStorage.setItem(FLAG,"1");
      console.log("Guia Treino: reload para aplicar restore");
      location.reload();
    }
  }catch(e){
    console.error("autoRestoreAndSync",e);
    showCloudBanner("☁ Erro: "+e.message,"err");
  }
})();

function SessionHomeView({onSelect,activeProgram,setActiveProgram}){
  // ── Programa ativo (Split ⇄ Full Body) ──────────────────────
  const prog=PROGRAMS[activeProgram]||PROGRAMS.split;
  const CYCLE=prog.cycle;
  const cycleSessions=new Set(CYCLE.filter(i=>i.type==="workout").map(i=>i.session));
  // ── Log + helpers de ciclo ──────────────────────────────────
  const [log]=useState(()=>getWorkoutLog());// lê uma vez ao montar, não a cada render
  function dateKey(ts){const d=new Date(ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
  const todayK=dateKey(Date.now());
  function getCompletedWorkoutDays(){
    // Considera só as sessões do ciclo ativo (isola histórico entre programas e exclui Bônus)
    const seen=new Set();const arr=[];
    log.forEach(e=>{
      if(!e||!e.session||!cycleSessions.has(e.session))return;
      const key=dateKey(e.ts)+"|"+e.session;
      if(seen.has(key))return;
      seen.add(key);
      arr.push({date:dateKey(e.ts),session:e.session,ts:e.ts});
    });
    return arr.sort((a,b)=>a.ts-b.ts);
  }
  function getLastCompletedMainWorkout(){const d=getCompletedWorkoutDays();return d.length?d[d.length-1]:null;}
  function getNextCycleItemFromLastWorkout(lastSession){
    if(!lastSession)return CYCLE[0];
    const idx=CYCLE.findIndex(i=>i.type==="workout"&&i.session===lastSession);
    if(idx<0)return CYCLE[0];
    return CYCLE[(idx+1)%CYCLE.length];
  }
  function getNextWorkoutAfter(lastSession){
    const startIdx=lastSession?CYCLE.findIndex(i=>i.type==="workout"&&i.session===lastSession):-1;
    for(let i=1;i<=CYCLE.length;i++){
      const item=CYCLE[((startIdx<0?-1:startIdx)+i+CYCLE.length)%CYCLE.length];
      if(item.type==="workout")return item;
    }
    return CYCLE[0];
  }
  // Primeiro uso: sem histórico → recomenda pelo dia da semana.
  // Dia 1 = segunda-feira. Domingo (0) e sábado (6) viram descanso.
  function getFirstUseRecommendationByWeekday(now){
    const dow=now.getDay(); // 0=Dom, 1=Seg, ..., 6=Sáb
    const MAP={
      1:{type:"workout",session:"Superiores 1"},
      2:{type:"workout",session:"Superiores 2"},
      3:{type:"rest",nextSession:"Inferiores"},
      4:{type:"workout",session:"Inferiores"},
      5:{type:"workout",session:"Superiores 3"},
      6:{type:"rest",nextSession:"Superiores 1"},
      0:{type:"rest",nextSession:"Superiores 1"}
    };
    return MAP[dow]||{type:"workout",session:"Superiores 1"};
  }
  // Primeiro uso program-aware: Split usa o calendário; Full Body começa no 1º treino do ciclo.
  function getFirstUse(){
    if(activeProgram==="split")return getFirstUseRecommendationByWeekday(new Date());
    const first=CYCLE.find(i=>i.type==="workout")||CYCLE[0];
    return{type:"workout",session:first.session};
  }
  function getHomeTrainingRecommendation(){
    const days=getCompletedWorkoutDays();
    const todayDone=days.filter(d=>d.date===todayK);
    // CONCLUÍDO — algum treino principal feito hoje
    if(todayDone.length>0){
      const lastTodaySession=todayDone[todayDone.length-1].session;
      const next=getNextCycleItemFromLastWorkout(lastTodaySession);
      const nextWorkout=next.type==="workout"?next:getNextWorkoutAfter(lastTodaySession);
      const nextLabel=next.type==="rest"?"Próximo: Descanso · "+nextWorkout.session:"Próximo: "+nextWorkout.session;
      return{status:"done_today",label:"Concluído",heroSession:lastTodaySession,nextLabel,playSession:nextWorkout.session};
    }
    const last=days.length?days[days.length-1].session:null;
    // ── PRIMEIRO USO (sem histórico) ─ recomenda pelo dia da semana
    if(!last){
      const firstUse=getFirstUse();
      if(firstUse.type==="rest"){
        return{status:"rest",label:"Descanso",heroSession:firstUse.nextSession,nextLabel:"Próximo treino: "+firstUse.nextSession,playSession:firstUse.nextSession};
      }
      return{status:"workout",label:"Para hoje",heroSession:firstUse.session,playSession:firstUse.session};
    }
    // ── COM HISTÓRICO ─ ignora calendário, segue o ciclo adaptativo
    const next=getNextCycleItemFromLastWorkout(last);
    // DESCANSO — próximo item do ciclo é rest
    if(next.type==="rest"){
      const nextW=getNextWorkoutAfter(last);
      return{status:"rest",label:"Descanso",heroSession:nextW.session,nextLabel:"Próximo treino: "+nextW.session,playSession:nextW.session};
    }
    // PENDENTE — próximo é treino mas não foi feito hoje (e há histórico)
    return{status:"pending",label:"Pendente",heroSession:next.session,nextLabel:"Continue sua sequência de onde parou.",playSession:next.session};
  }
  const rec=getHomeTrainingRecommendation();
  // Grid mostra apenas as sessões do programa ativo
  const progSessions=SESSIONS.filter(s=>prog.sessions.includes(s.s));
  // O card recomendado abre o treino que o botão realmente inicia. Em
  // done_today heroSession é o treino JÁ FEITO e playSession é o próximo —
  // mostrar o primeiro e iniciar o segundo era mentira do card (v125).
  const sesCard=SESSIONS.find(s=>s.s===rec.playSession)||SESSIONS.find(s=>s.s===rec.heroSession)||null;
  // Depois do recomendado, a fila segue a ordem do ciclo (extras no fim) —
  // é a mesma ordem que os rótulos "Nº no ciclo" anunciam.
  const carrossel=(()=>{
    const ordem=CYCLE.filter(i=>i.type==="workout").map(i=>i.session);
    const pos=x=>{const i=ordem.indexOf(x.s);return i<0?999:i;};
    const resto=progSessions.filter(x=>!sesCard||x.s!==sesCard.s).sort((a,b)=>pos(a)-pos(b));
    return sesCard?[sesCard].concat(resto):resto;
  })();
  // Ordem dos treinos dentro do ciclo — rotula os cards com algo que o motor
  // respeita, em vez do dia da semana do plano original, que ele ignora.
  const ordemCiclo=CYCLE.filter(i=>i.type==="workout").map(i=>i.session);
  const rotuloCard=sess=>{
    const i=ordemCiclo.indexOf(sess.s);
    return i>=0?(i+1)+"º no ciclo":"Extra";
  };
  // ── "Hoje" acompanha a virada do dia ─────────────────────────
  // O PWA fica dias aberto no celular; sem isto a faixa da semana e a grade
  // de 28 dias congelam no dia em que a tela montou.
  const [diaAtual,setDiaAtual]=useState(()=>new Date().toDateString());
  useEffect(()=>{
    const check=()=>{const d=new Date().toDateString();setDiaAtual(prev=>prev===d?prev:d);};
    const id=setInterval(check,60000);
    document.addEventListener("visibilitychange",check);
    window.addEventListener("focus",check);
    return()=>{clearInterval(id);document.removeEventListener("visibilitychange",check);window.removeEventListener("focus",check);};
  },[]);
  // ── Métricas da Home (um passe só, escopo do programa ativo) ──
  // Escopos, de propósito diferentes:
  //   getCompletedWorkoutDays() → só o ciclo, alimenta a RECOMENDAÇÃO
  //   daqui pra baixo          → prog.sessions (inclui Bônus), alimenta o que
  //                              a tela MOSTRA. Antes volume e PSE liam o log
  //                              inteiro e cruzavam programas.
  const dados=useMemo(()=>{
    const nomesDoPrograma=new Set(prog.sessions);
    const diaBase=new Date();diaBase.setHours(0,0,0,0);
    // Aritmética por Date, não por múltiplos de 86400000: em fuso com
    // horário de verão somar ms cai às 23h do dia anterior.
    const addDias=(base,n)=>{const d=new Date(base);d.setDate(d.getDate()+n);d.setHours(0,0,0,0);return d;};
    const Y=diaBase.getFullYear(),Mo=diaBase.getMonth();
    const porDia={};// dateKey -> {vol, pses:[]}
    const noMesPorEx={};
    const psesDoMes=[];
    (log||[]).forEach(e=>{
      if(!e||!e.ts||!nomesDoPrograma.has(e.session))return;
      const k=dateKey(e.ts);
      const d=porDia[k]||(porDia[k]={vol:0,pses:[]});
      d.vol+=(Number(e.carga)||0)*(Number(e.reps)||0);
      const pse=Number(e.pse)||0;
      if(pse>0)d.pses.push(pse);
      const dt=new Date(e.ts);
      if(dt.getFullYear()===Y&&dt.getMonth()===Mo){
        if(pse>0)psesDoMes.push(pse);
        if(Number(e.carga||0)>0)(noMesPorEx[e.exerciseId]=noMesPorEx[e.exerciseId]||[]).push(e);
      }
    });
    const treinou=k=>!!porDia[k];
    // Faixa da semana (segunda→domingo)
    const inicioSemana=addDias(diaBase,-((diaBase.getDay()+6)%7));
    const INICIAIS=["S","T","Q","Q","S","S","D"],NOMES=["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];
    const weekDays=Array.from({length:7},(_,i)=>{

    const MESES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
    const fmtDiaMes=d=>d.getDate()+" "+MESES[d.getMonth()];

    const treinos28=last28.filter(d=>d.done).length;
    let melhorJanela=0;
    for(let i=0;i<=21;i++){
      const c=last28.slice(i,i+7).filter(d=>d.done).length;
      if(c>melhorJanela)melhorJanela=c;
    }
    // Volume: 8 janelas móveis de 7 dias, a última terminando hoje
    const volSeries=Array.from({length:8},(_,i)=>{
      const fim=addDias(diaBase,-(7-i)*7),ini=addDias(fim,-6);// janela termina HOJE, não daqui a 6 dias
      let v=0;
      for(let d=new Date(ini);d<=fim;d.setDate(d.getDate()+1)){
        const b=porDia[dateKey(d.getTime())];
        if(b)v+=b.vol;
      }
      return v;
    });
    const volAtual=volSeries[7],volAnterior=volSeries[6];
    const volPct=volAnterior>0?((volAtual-volAnterior)/volAnterior)*100:null;
    // PSE das últimas 7 sessões (média por dia de treino)
    const pseUltimos=Object.keys(porDia).filter(k=>porDia[k].pses.length).sort().slice(-7)
      .map(k=>{const a=porDia[k].pses;return a.reduce((x,y)=>x+y,0)/a.length;});
    // Mês
    const pseMed=psesDoMes.length?(psesDoMes.reduce((a,b)=>a+b,0)/psesDoMes.length):0;
    let bestEvo=null,bestEvoPct=null;
    Object.values(noMesPorEx).forEach(arr=>{
      if(arr.length<2)return;
      arr.sort((a,b)=>a.ts-b.ts);
      const first=Number(arr[0].carga),last=Number(arr[arr.length-1].carga);
      const deltaKg=parseFloat((last-first).toFixed(1));

      if(first>=5&&deltaKg>0){
        const pct=(deltaKg/first)*100;
        if(!bestEvoPct||pct>bestEvoPct.pct)bestEvoPct={pct,kg:deltaKg,name:arr[0].exerciseName||"Exercício"};
      }
    });
    // Tempo médio do mês — workout_sessions é derivado do log, filtra igual
    let tempoMed=0;
    try{
      const raw=localStorage.getItem("workout_sessions");
      const arr=raw?JSON.parse(raw):[];
      const durs=(Array.isArray(arr)?arr:[]).filter(x=>{
        if(!x||!nomesDoPrograma.has(x.session))return false;
        const d=new Date(x.ts);return d.getFullYear()===Y&&d.getMonth()===Mo;
      }).map(x=>Number(x.durationMin)||0).filter(d=>d>0);
      if(durs.length)tempoMed=Math.round(durs.reduce((a,b)=>a+b,0)/durs.length);
    }catch(e){}
    return{weekDays,last28,treinos28,melhorJanela,volSeries,volAtual,volPct,pseUltimos,pseMed,
      bestEvo,bestEvoPct,tempoMed,
      faixaSemana:fmtDiaMes(inicioSemana)+" – "+fmtDiaMes(addDias(inicioSemana,6))};
  },[log,activeProgram,diaAtual]);
  const {weekDays,last28,treinos28,melhorJanela,volSeries,volAtual,volPct,pseUltimos,pseMed,bestEvo,bestEvoPct,tempoMed,faixaSemana}=dados;
  const pseMax=10;// escala absoluta: PSE vai de 0 a 10, barra não normaliza pelo próprio máximo
  const fmtPse=v=>v>0?v.toFixed(1):"–";
  const fmtEvoPct=v=>{if(!v)return"–";return v.pct>=10?"+"+Math.round(v.pct)+"%":"+"+v.pct.toFixed(1)+"%";};
  const fmtVolPct=v=>(v>=0?"+":"")+(Math.abs(v)>=10?Math.round(v):v.toFixed(1))+"%";
  const fmtVolAbs=v=>v>=1000?(v/1000).toFixed(1).replace(".",",")+" t":Math.round(v)+" kg";
  // Sparkline do volume — só desenha com mais de uma semana com carga
  const spark=(()=>{
    if(volSeries.filter(v=>v>0).length<2)return null;
    const max=Math.max.apply(null,volSeries),min=Math.min.apply(null,volSeries),span=(max-min)||1;
    const pts=volSeries.map((v,i)=>[2+i*(129/7),38-((v-min)/span)*32]);
    const d=pts.map(pt=>pt[0].toFixed(1)+" "+pt[1].toFixed(1)).join(" L ");

  })();
  // Acento do card recomendado — status manda na cor, inclusive na borda
  const accentHoje=rec.status==="pending"?"#F59E0B":rec.status==="rest"?"#A3A3A3":"#C6FF00";
  const glowHoje=rec.status==="pending"?"0 10px 26px rgba(245,158,11,0.28)":rec.status==="rest"?"none":"0 10px 26px rgba(198,255,0,0.28)";
  const bordaHoje=rec.status==="pending"?"rgba(245,158,11,0.28)":rec.status==="rest"?"rgba(163,163,163,0.22)":"rgba(198,255,0,0.22)";
  // Em done_today o rótulo do card fala do PRÓXIMO treino, que é o que ele abre
  const rotuloHoje=rec.status==="done_today"?"Próximo treino":(rec.label||"Para hoje");
  const cardBase={background:"#121212",borderRadius:20,boxShadow:"0 8px 24px rgba(0,0,0,.25)"};
  const lblStyle={fontSize:10,fontWeight:700,letterSpacing:1.5,color:"#A3A3A3",textTransform:"uppercase"};
  // paddingBottom folgado: o chip de versão é fixo em bottom:72 e encostava
  // no último card agora que a Home cabe numa tela só
  return h("div",{className:"screen-enter",style:{background:"#050505",minHeight:"100vh",paddingBottom:48}},
    h("div",{style:{maxWidth:1040,margin:"0 auto",padding:"28px 24px 0"}},
      // ── Seletor de programa (Split ⇄ Full Body) ──────────────
      h("div",{style:{display:"flex",gap:6,background:"#121212",padding:5,borderRadius:14,marginBottom:24,boxShadow:"0 6px 20px rgba(0,0,0,.22)"}},
        Object.keys(PROGRAMS).map(pid=>{
          const on=(activeProgram||"split")===pid;
          return h("button",{key:pid,onClick:()=>setActiveProgram&&setActiveProgram(pid),
            "aria-pressed":on,

function ExerciseGridView({selS,sc,onBack,onSelect,currentBlock,setCurrentBlock,setSb}){
  const sesEx=EX.filter(x=>x.s===selS);

  const bk=currentBlock||"b1";
  const BK_LOCAL=["b1","b2","b3","dl"];
  function fmtPres(ex){
    const str=ex[bk];if(!str)return null;
    const sm=str.match(/(\d+)(?:-\d+)?\s*[x×]/i);
    const rm=str.match(/[x×]\s*(\d+)(?:-(\d+))?/i);
    const pm=str.match(/PSE\s*(\d+)(?:-(\d+))?/i);
    if(!sm||!rm)return null;
    const r=rm[2]?rm[1]+"–"+rm[2]:rm[1];
    const p=pm?(pm[2]?pm[1]+"–"+pm[2]:pm[1]):null;
    return sm[1]+"×"+r+(p?" · PSE "+p:"");
  }
  function fmtBlockPres(blockKey){
    // Pega prescrição genérica do primeiro exercício da sessão como amostra
    const sample=sesEx.find(x=>x[blockKey])||sesEx[0];
    if(!sample||!sample[blockKey])return null;
    const str=sample[blockKey];
    const sm=str.match(/(\d+)(?:-(\d+))?\s*[x×]/i);
    const rm=str.match(/[x×]\s*(\d+)(?:-(\d+))?/i);
    const pm=str.match(/PSE\s*(\d+)(?:-(\d+))?/i);
    if(!sm||!rm)return null;
    const ss=sm[2]?sm[1]+"–"+sm[2]:sm[1];
    const r=rm[2]?rm[1]+"–"+rm[2]:rm[1];
    const p=pm?(pm[2]?pm[1]+"–"+pm[2]:pm[1]):null;
    return ss+"×"+r+(p?" · PSE "+p:"");
  }

      // ── PERIODIZAÇÃO (cards lado a lado) ───────────────────────
      h("div",{style:{marginBottom:28}},

        h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10}},

function TreinoView(){

  const[activeProgram,setActiveProgram]=useState(()=>localStorage.getItem("activeProgram")||"split");
  const handleSetProgram=(p)=>{localStorage.setItem("activeProgram",p);setActiveProgram(p);};
  const[exOpen,setExOpen]=useState(true);

  const[stClosing,setStClosing]=useState(false);
  const tf=useRef(null);
  const cdRef=useRef(null);
  const etRef=useRef(null);
  const stCloseRef=useRef(null);// ref para o timeout de animação de closeRest
  const alarmRef=useRef(null);// ref para o intervalo de alarme ao fim do descanso
  function playAlarm(){try{navigator.vibrate&&navigator.vibrate([200,100,200,100,200]);}catch(e){}try{const ac=new(window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.setValueAtTime(.6,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.28);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.3);});setTimeout(()=>ac.close().catch(()=>{}),1400);}catch(e){}}
  useEffect(()=>{clearTimeout(tf.current);tf.current=null;if(tr&&tl>0){tf.current=setTimeout(()=>setTl(v=>v-1),1000);}else if(tl===0&&tr){setTr(false);playAlarm();clearInterval(alarmRef.current);alarmRef.current=setInterval(playAlarm,4000);}return()=>clearTimeout(tf.current);},[tr,tl]);// playAlarm omitido: função pura de Web Audio, não fecha sobre estado React
  useEffect(()=>{if(cntd===null||cntd<=0)return;cdRef.current=setTimeout(()=>{if(cntd===1){setCntd(null);setExRun(true);setExTime(0);}else setCntd(v=>v-1);try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}},1000);return()=>clearTimeout(cdRef.current);},[cntd]);
  useEffect(()=>{
    clearInterval(etRef.current);etRef.current=null;// limpa antes de criar novo — previne acúmulo em double-toggle
    if(exRun){
      const startTs=Date.now()-(exTime*1000);
      etRef.current=setInterval(()=>setExTime((Date.now()-startTs)/1000),50);
    }
    return()=>clearInterval(etRef.current);
  },[exRun]);
  useEffect(()=>{if(selEx)document.body.classList.add("in-exercise");else document.body.classList.remove("in-exercise");return()=>document.body.classList.remove("in-exercise");},[selEx]);
  useEffect(()=>{if(exRun)document.body.classList.add("in-active-set");else document.body.classList.remove("in-active-set");return()=>document.body.classList.remove("in-active-set");},[exRun]);
  useEffect(()=>()=>{clearTimeout(stCloseRef.current);clearInterval(alarmRef.current);},[]);// cleanup de timeouts/intervalos

function CoachView(){
  const[ob,setOb]=useState(null);
  const[showAllHist,setShowAllHist]=useState(false);
  const[guiaOpen,setGuiaOpen]=useState(false);
  const[syncStatus,setSyncStatus]=useState("idle");
  const[syncMsg,setSyncMsg]=useState("");
  const[diagOpen,setDiagOpen]=useState(false);
  const[diagResult,setDiagResult]=useState(null);
  const[currentUid,setCurrentUid]=useState(()=>{try{return getUserId();}catch(e){return"";}});
  const[,forceUpdate]=useState(0);// força re-render após apagar histórico
  const[openIds,setOpenIds]=useState(()=>{
    try{const arr=getWorkoutLog();if(!Array.isArray(arr)||arr.length===0)return new Set();
      let maxTs=0,key=null;
      arr.forEach(e=>{if(e&&e.session&&e.ts>maxTs){maxTs=e.ts;key=e.date+"|"+e.session;}});
      return key?new Set([key]):new Set();}catch(e){return new Set();}
  });
  function toggleOpen(key){setOpenIds(prev=>{const next=new Set(prev);if(next.has(key))next.delete(key);else next.add(key);return next;});}
  function getLog(){return getWorkoutLog();}
  function parseRange(str){if(!str)return null;const m=str.match(/PSE\s*([0-9]+)(?:-([0-9]+))?/i);if(!m)return null;return{pMin:parseInt(m[1]),pMax:parseInt(m[2]||m[1])};}
  function fmtDate(d){const p=String(d).split("/");return p.length===3?p[0]+"/"+p[1]:d;}
  function pseClr(p){return p<=4?"#A3A3A3":p<=6?"#F59E0B":p<=8?"#C6FF00":"#EF4444";}
  const BLK_LBL={b1:"Bloco 1 · Volume",b2:"Bloco 2 · Intensidade",b3:"Bloco 3 · Carga",dl:"Deload · Recuperação"};
  function groupWorkouts(){
    const log=getLog();
    const groups={};
    log.forEach(e=>{
      if(!e||!e.session)return;
      const key=e.date+"|"+e.session;
      if(!groups[key])groups[key]={date:e.date,session:e.session,sets:[],ts:e.ts,tsEnd:e.ts,block:e.block||null};
      const g=groups[key];
      g.sets.push(e);
      if(e.ts<g.ts)g.ts=e.ts;
      if(e.ts>g.tsEnd)g.tsEnd=e.ts;
      if(!g.block&&e.block)g.block=e.block;
    });
    return Object.values(groups).map(g=>{
      const totalSets=g.sets.length;
      const totalReps=g.sets.reduce((a,s)=>a+(Number(s.reps)||0),0);
      const pseValid=g.sets.map(s=>Number(s.pse)).filter(p=>p>0);
      const pseAvg=pseValid.length?pseValid.reduce((a,b)=>a+b,0)/pseValid.length:0;
      const maxCarga=g.sets.reduce((a,s)=>Math.max(a,Number(s.carga)||0),0);
      const heavyCount=g.sets.filter(s=>Number(s.pse)>=9).length;
      const sumDur=g.sets.reduce((a,s)=>a+(Number(s.duration)||0),0);
      const spanMs=g.tsEnd-g.ts;
      const durMin=spanMs>60000?Math.round(spanMs/60000):(sumDur>=60?Math.round(sumDur/60):0);
      const durEstimated=spanMs<=60000;
      const byEx={};
      g.sets.forEach(s=>{
        if(!byEx[s.exerciseId])byEx[s.exerciseId]={id:s.exerciseId,name:s.exerciseName||"Exercício",sets:[],reps:0,maxCarga:0,pseSum:0,pseN:0,best:null};
        const ex=byEx[s.exerciseId];
        ex.sets.push(s);
        ex.reps+=(Number(s.reps)||0);
        const c=Number(s.carga)||0;
        if(c>ex.maxCarga)ex.maxCarga=c;
        const p=Number(s.pse);
        if(p>0){ex.pseSum+=p;ex.pseN++;}
        const sr=Number(s.reps)||0;
        if(!ex.best||c>(ex.best.carga||0)||(c===(ex.best.carga||0)&&sr>(ex.best.reps||0))){ex.best={carga:c,reps:sr,pse:p};}
      });
      const perExercise=Object.values(byEx).map(ex=>({...ex,pseAvg:ex.pseN>0?ex.pseSum/ex.pseN:0}));
      return{...g,totalSets,totalReps,pseAvg,maxCarga,heavyCount,durMin,durEstimated,perExercise};
    }).sort((a,b)=>b.tsEnd-a.tsEnd);
  }
  function generateCoachComment(g,allGroups){
    if(!g||!g.sets.length)return[];
    const comments=[];
    const block=g.block||"b1";
    const sessionEx=EX.filter(x=>x.s===g.session);
    const sample=sessionEx.find(x=>x[block])||sessionEx[0];
    const range=sample?parseRange(sample[block]):{pMin:6,pMax:8};
    if(g.pseAvg>0&&range){
      if(g.pseAvg>range.pMax+0.3){
        comments.push("O treino ficou mais pesado que o alvo do bloco (PSE "+range.pMin+"–"+range.pMax+"). No próximo, reduza um pouco a carga ou pare com mais reserva.");
      }else if(g.pseAvg<range.pMin-0.3){
        comments.push("O treino ficou leve para o alvo do bloco (PSE "+range.pMin+"–"+range.pMax+"). Se a execução estiver boa, aumente levemente carga ou reps.");
      }else{
        comments.push("Boa zona de estímulo. PSE médio "+g.pseAvg.toFixed(1)+" — mantenha a carga e tente evoluir 1 repetição ou melhorar execução.");
      }
    }
    if(g.heavyCount>=3){
      comments.push("Você acumulou "+g.heavyCount+" séries próximas da falha. Use com cuidado para não prejudicar a recuperação.");
    }
    const idx=allGroups.indexOf(g);
    const previous=allGroups.slice(idx+1);
    let bestProg=null,biggestDrop=null;
    g.perExercise.forEach(curEx=>{
      if(curEx.maxCarga<=0)return;
      for(const w of previous){
        const prev=w.perExercise.find(pe=>pe.id===curEx.id);
        if(prev&&prev.maxCarga>0){
          const delta=parseFloat((curEx.maxCarga-prev.maxCarga).toFixed(1));
          if(delta>0&&(!bestProg||delta>bestProg.delta))bestProg={name:curEx.name,prev:prev.maxCarga,curr:curEx.maxCarga,delta};
          if(delta<0&&(!biggestDrop||delta<biggestDrop.delta))biggestDrop={name:curEx.name,prev:prev.maxCarga,curr:curEx.maxCarga,delta};
          break;
        }
      }
    });
    if(bestProg)comments.push("Boa evolução em "+bestProg.name+": carga subiu de "+bestProg.prev+"kg para "+bestProg.curr+"kg.");
    if(biggestDrop&&!bestProg)comments.push("Carga caiu em "+biggestDrop.name+" (de "+biggestDrop.prev+"kg para "+biggestDrop.curr+"kg). Pode ser fadiga, ajuste técnico ou recuperação.");
    return comments.slice(0,3);
  }
  // eslint-disable-line — deps [] correto: log só muda com reload de página
  const groups=useMemo(()=>groupWorkouts(),[]);
  const last=groups[0]||null;
  const lastComments=generateCoachComment(last,groups);
  const history=groups.slice(1);
  const historyShown=showAllHist?history:history.slice(0,9);
  const mc=(label,value,accent)=>h("div",{style:{background:"#0D0D0D",borderRadius:12,padding:"12px 14px",flex:"1 1 0",minWidth:0}},
    h("div",{className:"bn",style:{fontSize:22,fontWeight:900,color:accent||"#F5F5F5",letterSpacing:.05,lineHeight:1}},value),
    h("div",{style:{fontSize:9,fontWeight:700,letterSpacing:1.5,color:"#A3A3A3",textTransform:"uppercase",marginTop:6}},label));

      style:{all:"unset",display:"block",width:"100%",textAlign:"left",boxSizing:"border-box",marginBottom:12,background:"#121212",borderRadius:28,padding:"22px 24px",cursor:"pointer",boxShadow:isOpen?"0 12px 32px rgba(0,0,0,.35)":"0 6px 18px rgba(0,0,0,.22)"}},

        h("div",{style:{display:"flex",alignItems:"center",gap:12}},
          h("span",{style:{fontSize:10,fontWeight:800,letterSpacing:1.2,color:"#C6FF00",textTransform:"uppercase"}},"✓ Concluído"),
          h("span",{style:{fontSize:11,color:"#666666",transition:"transform .2s",transform:isOpen?"rotate(180deg)":"none",display:"inline-block"}},"▼"))),
      // Título do treino (SF Pro, sem condensar)
      h("div",{style:{fontFamily:"-apple-system,BlinkMacSystemFont,'SF Pro Display','Inter',sans-serif",fontSize:34,fontWeight:900,color:"#F5F5F5",letterSpacing:-1,lineHeight:1,marginBottom:4}},g.session),
      // Bloco
      g.block&&h("div",{style:{fontSize:12,color:"#A3A3A3",fontWeight:600,marginBottom:14}},BLK_LBL[g.block]||g.block),
      !g.block&&h("div",{style:{height:14}}),
      // Linha de métricas resumidas
      h("div",{style:{fontSize:12.5,color:"#A3A3A3",fontWeight:500,lineHeight:1.5}},
        g.totalSets+" séries · "+g.totalReps+" reps"+
        (g.maxCarga>0?" · "+g.maxCarga+"kg top":"")+
        (g.pseAvg>0?" · PSE "+g.pseAvg.toFixed(1):"")+
        (g.durMin>0?" · "+g.durMin+"min":"")),

      isOpen&&h("div",{style:{marginTop:18,paddingTop:16,borderTop:"1px solid rgba(255,255,255,0.06)"}},

            h("span",{style:{color:"#F5F5F5",fontWeight:600,flex:"1 1 0",minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},ex.name),
            h("span",{style:{color:"#A3A3A3",fontWeight:500,flexShrink:0}},
              ex.sets.length+"×"+(ex.reps>0?" "+ex.reps+"r":"")+(ex.maxCarga>0?" · "+ex.maxCarga+"kg top":"")+(ex.pseN>0?" · PSE "+ex.pseAvg.toFixed(1):""))))),
        comments.length>0&&h("div",{style:{background:"rgba(198,255,0,0.08)",borderRadius:20,padding:"14px 16px"}},
          h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
            h("span",{style:{fontSize:14,color:"#C6FF00"}},"✦"),
            h("span",{style:{fontSize:11,fontWeight:800,color:"#C6FF00",letterSpacing:.5,textTransform:"uppercase"}},"Comentário do coach")),
          h("div",{style:{display:"flex",flexDirection:"column",gap:8}},

  }
  return h("div",{className:"screen-enter",style:{maxWidth:1040,margin:"0 auto",padding:"0 0 32px"}},
    h("div",{style:{padding:"28px 24px 0"}},
      h("h1",{style:{fontSize:60,fontWeight:900,color:"#F5F5F5",margin:0,lineHeight:1}},"Coach"),
      h("p",{style:{fontSize:15,color:"#A3A3A3",margin:"10px 0 0",fontWeight:500,letterSpacing:-.1}},"Análise dos seus treinos e próximos ajustes.")),
    !last&&h("div",{style:{padding:"24px 24px 0"}},
